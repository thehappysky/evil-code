name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev,tui]"
      - name: Check installed dependencies
        run: python -m pip check
      - name: Check README links, images and diagram sources
        run: python scripts/check_readme.py
      - name: Run tests and coverage gate
        run: python -m pytest -q --tb=short
      - name: Validate evaluation tasks and run offline harness gate
        run: |
          python -m code_agent.evals validate
          python -m code_agent.evals run --mode reference --repeats 2 --output .eval-runs/ci-reference --fail-under 1
          python -m code_agent.evals export --run .eval-runs/ci-reference --output .eval-runs/ci-summary.json
      - name: Upload content-free evaluation summary
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-summary-python-${{ matrix.python-version }}
          path: .eval-runs/ci-summary.json
